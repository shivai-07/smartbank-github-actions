
name: SmartBank Marketplace Actions Demo

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  setup-environment:
    name: Configure Java Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java Version
        run: java -version

      - name: Verify Maven Version
        run: mvn -version

      - name: Display Project Information
        run: echo "SmartBank Java 17 environment is ready!"
